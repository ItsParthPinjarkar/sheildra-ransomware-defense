# PR-Agent / Qodo Configuration for AutoVault
# Uses OpenRouter as the model provider

[config]
# Use OpenRouter as OpenAI-compatible provider
model = "gpt-4o"
fallback_models = ["openai/gpt-4o-mini"]
tools = ["review", "improve", "describe"]

[openai]
# OpenRouter is OpenAI-compatible
api_base = "https://openrouter.ai/api/v1"

[pr_reviewer]
enable_security_scanning = true
review_effort = "heavy"
require_score_threshold = true
extra_instructions = """
Focus on:
1. Security vulnerabilities (especially in MCP tool implementations)
2. Error handling in async functions
3. Proper input validation for all tool parameters
4. Thread safety in multi-agent orchestration
5. Resource cleanup and memory management
"""

[pr_code_suggestions]
num_code_suggestions = 5
prioritize_suggestions = true

[pr_description]
enable_semantic_types = true
enable_walkthrough = true

[handle_push_trigger]
handle_push_trigger = true

[dismiss_invalid_review_comments]
dismiss_invalid_review_comments = true
