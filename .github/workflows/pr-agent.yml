name: PR Agent Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && 
       contains(github.event.comment.body, '/review') ||
       contains(github.event.comment.body, '/improve') ||
       contains(github.event.comment.body, '/describe') ||
       contains(github.event.comment.body, '/ask'))
    
    permissions:
      contents: write
      pull-requests: write
      issues: write
      
    steps:
      - name: PR Agent review
        uses: the-pr-agent/pr-agent@main
        env:
          OPENAI__KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI__API_BASE: "https://openrouter.ai/api/v1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: review
          
      - name: PR Agent describe
        if: github.event.action == 'opened'
        uses: the-pr-agent/pr-agent@main
        env:
          OPENAI__KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI__API_BASE: "https://openrouter.ai/api/v1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: describe
