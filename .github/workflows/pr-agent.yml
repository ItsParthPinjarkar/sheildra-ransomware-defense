name: PR Agent (Code Review)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: PR Agent review
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI__KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI__API_BASE: "https://openrouter.ai/api/v1"
          config.model: "openai/meta-llama/llama-3.3-70b-instruct"
          config.fallback_models: '["openai/meta-llama/llama-3.1-8b-instruct:free"]'
          config.custom_model_max_tokens: "8192"
          config.patch: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
          pr_code_suggestions.num_code_suggestions: "5"
          pr_reviewer.review_effort: "heavy"
          pr_reviewer.enable_security_scanning: "true"
          pr_description.enable_semantic_types: "true"
        with:
          command: review

      - name: PR Agent describe
        if: github.event.action == 'opened'
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI__KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI__API_BASE: "https://openrouter.ai/api/v1"
          config.model: "openai/meta-llama/llama-3.3-70b-instruct"
          config.fallback_models: '["openai/meta-llama/llama-3.1-8b-instruct:free"]'
          config.custom_model_max_tokens: "8192"
        with:
          command: describe

      - name: PR Agent improve
        if: github.event.action == 'opened'
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI__KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI__API_BASE: "https://openrouter.ai/api/v1"
          config.model: "openai/meta-llama/llama-3.3-70b-instruct"
          config.fallback_models: '["openai/meta-llama/llama-3.1-8b-instruct:free"]'
          config.custom_model_max_tokens: "8192"
        with:
          command: improve
